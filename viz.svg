<svg xmlns="http://www.w3.org/2000/svg" width="760" height="589.0" viewBox="0 0 760 589.0" role="img" aria-label="Step-by-step visual walkthrough">
<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 z" fill="context-stroke"/></marker></defs>
<rect x="1.0" y="1.0" width="758.0" height="587.0" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.2"/>
<text x="24.0" y="34.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" fill="#1e293b" text-anchor="start" font-weight="600">Reconstruct Itinerary — Hierholzer, smallest airport first</text>
<circle cx="35.0" cy="74.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="78.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">1</text>
<text x="56.0" y="79.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Use every ticket exactly once from JFK, choosing lexicographically smallest when</text>
<text x="56.0" y="98.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">stuck with options. Tickets: JFK→MUC, MUC→LHR, LHR→SFO, SFO→SJC.</text>
<line x1="132.3" y1="171.2" x2="234.1" y2="223.9" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="271.4" y1="224.8" x2="373.1" y2="172.1" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="410.4" y1="171.2" x2="512.1" y2="223.9" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<line x1="549.1" y1="224.1" x2="639.0" y2="172.9" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
<circle cx="114.6" cy="162.0" r="18" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="114.6" y="167.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">JFK</text>
<circle cx="253.6" cy="234.0" r="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
<text x="253.6" y="239.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">MUC</text>
<circle cx="392.6" cy="162.0" r="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
<text x="392.6" y="167.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">LHR</text>
<circle cx="531.7" cy="234.0" r="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
<text x="531.7" y="239.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">SFO</text>
<circle cx="658.1" cy="162.0" r="18" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.4"/>
<text x="658.1" y="167.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">SJC</text>
<line x1="24.0" y1="282.0" x2="736.0" y2="282.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="302.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="306.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">2</text>
<text x="56.0" y="307.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">This is an Eulerian path. Hierholzer's: DFS consuming edges (always the smallest</text>
<text x="56.0" y="326.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">destination first — keep each adjacency sorted), appending each airport ON RETURN.</text>
<text x="56.0" y="345.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Dead ends sink to the output's tail.</text>
<text x="72.0" y="380.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#64748b" text-anchor="end">why not greedy</text>
<rect x="84.0" y="361.0" width="279.0" height="28.0" rx="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.2"/>
<text x="223.5" y="380.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">greedy alone → can strand you</text>
<rect x="84.0" y="397.0" width="369.0" height="28.0" rx="6" fill="#dbeafe" stroke="#2563eb" stroke-width="1.2"/>
<text x="268.5" y="416.0" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#1e293b" text-anchor="middle">Hierholzer → post-order append fixes it</text>
<line x1="24.0" y1="441.0" x2="736.0" y2="441.0" stroke="#e2e8f0" stroke-width="1"/>
<circle cx="35.0" cy="461.0" r="11" fill="#2563eb" stroke="#2563eb" stroke-width="1.4"/>
<text x="35.0" y="465.5" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="600">3</text>
<text x="56.0" y="466.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Reverse the post-order: JFK MUC LHR SFO SJC. Sorted adjacency + Eulerian post-order</text>
<text x="56.0" y="485.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">= smallest valid itinerary, O(E log E).</text>
<text x="84.0" y="534.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="end">itinerary</text>
<rect x="94.0" y="509.0" width="44.0" height="38.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="116.0" y="533.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">JFK</text>
<text x="116.0" y="505.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">0</text>
<rect x="140.0" y="509.0" width="44.0" height="38.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="162.0" y="533.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">MUC</text>
<text x="162.0" y="505.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">1</text>
<rect x="186.0" y="509.0" width="44.0" height="38.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="208.0" y="533.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">LHR</text>
<text x="208.0" y="505.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">2</text>
<rect x="232.0" y="509.0" width="44.0" height="38.0" rx="6" fill="#eef2f7" stroke="#94a3b8" stroke-width="1.2"/>
<text x="254.0" y="533.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">SFO</text>
<text x="254.0" y="505.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">3</text>
<rect x="278.0" y="509.0" width="44.0" height="38.0" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="1.2"/>
<text x="300.0" y="533.0" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#1e293b" text-anchor="middle">SJC</text>
<text x="300.0" y="505.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">4</text>
<text x="380.0" y="571.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">github.com/Sreenivas-Sadhu-Prabhakara · dsa series</text>
</svg>